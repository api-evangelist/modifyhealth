source: mcp/modifyhealth-mcp-tools.json + llms/modifyhealth-llms.txt
note: >-
  ModifyHealth publishes NO OpenAPI, so there are no operationIds to bind against. The
  REST side of this crosswalk is therefore the set of storefront JSON endpoints the
  provider documents itself, verbatim, in its own /llms.txt under "Read-Only Browsing
  (No Authentication Required)". Rows are bound by documented path pattern rather than
  operationId, and confidence is set accordingly. Nothing here is inferred from a spec
  that does not exist.
