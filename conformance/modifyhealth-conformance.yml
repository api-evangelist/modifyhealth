domain_standard:
  id: ucp-universal-commerce-protocol
  market: agentic commerce / retail checkout
  declared: true
  where: https://modifyhealth.com/.well-known/ucp
  detail: >-
    This is a contract-level declaration, not a marketing claim. The merchant profile
    names the reverse-domain capability identifiers dev.ucp.shopping.checkout,
    dev.ucp.shopping.cart, dev.ucp.shopping.fulfillment, dev.ucp.shopping.discount,
    dev.ucp.shopping.order, dev.ucp.shopping.catalog.search and
    dev.ucp.shopping.catalog.lookup, plus the Shopify extension dev.shopify.catalog, and
    binds each to a versioned ucp.dev JSON Schema. Payment handlers are declared the same
    way (com.google.pay, dev.shopify.card, dev.shopify.shop_pay). An agent that already
    speaks UCP can transact with this store with no bespoke connector.
  note: >-
    Conformance here is inherited from the Shopify platform rather than independently
    implemented by ModifyHealth. It is nonetheless served from ModifyHealth's host for
    ModifyHealth's shop and is genuinely callable, which is what the check measures.
compliance_program:
  published: false
  note: >-
    ModifyHealth publishes no trust center and names no certification (SOC 2, ISO 27001,
    HIPAA, PCI DSS). probe-security-programs.py returned vdp=none trust=none on
    2026-08-26. NO Compliance pointer emitted. Worth noting given the company sells into
    health plans and case managers, where a buyer would normally expect a stated HIPAA
    posture.
