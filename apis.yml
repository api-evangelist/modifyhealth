apis:
- aid: modifyhealth-ucp-mcp
  name: ModifyHealth UCP Commerce MCP
  description: 'The agent-facing commerce surface for the ModifyHealth store. A Universal
    Commerce Protocol (UCP) service exposed over MCP at https://modifyhealth.com/api/ucp/mcp,
    serving 13 unauthenticated tools for catalog search and lookup, product detail,
    cart create/update/get/cancel, and checkout create/update/get/complete/cancel. The
    transport and tool contract are provided by the Shopify platform and served from
    ModifyHealth''s own host and shop id (7887683702); the catalog, pricing and orders
    are ModifyHealth''s.'
