aid: modifyhealth
name: ModifyHealth
description: 'ModifyHealth is a US direct-to-consumer medically tailored meal delivery
  company that ships fully prepared, dietitian-crafted meal programs nationwide with
  free shipping. Its programs include Monash University Low FODMAP Certified, Mediterranean,
  gluten-free, heart-friendly, diabetes-friendly, carb-conscious and GLP-1 support
  plans, sold to consumers directly and to health plans, employers, case managers and
  referring clinicians as a food-as-medicine benefit. The storefront runs on Shopify
  and exposes a real machine surface for agents: a published /llms.txt and /agents.md,
  a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, and an
  unauthenticated MCP endpoint at /api/ucp/mcp serving 13 catalog, cart, checkout and
  order tools. ModifyHealth publishes no developer program, no OpenAPI, and no SDKs.'
