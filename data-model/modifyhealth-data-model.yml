constraints:
- >-
  Fulfillment is single-destination: the UCP profile declares
  allows_multi_destination.shipping false and allows_method_combinations [["shipping"]],
  so a cart cannot split across addresses or combine shipping with another method.
- >-
  Money on every entity is an integer in ISO 4217 minor units paired with a currency
  code.
